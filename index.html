    <meta name="author" content="Ricardo Fernando Cardenas Minaya" />
    
    <!-- Script Anti-FOUT inline síncrono para prevención de destello en modo oscuro -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('portfolio-theme');
          var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && systemPrefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
